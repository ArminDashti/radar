name: radar

services:
  radar-agent:
    image: ${IMAGE_TAG:-radar-agent:latest}
    container_name: radar-agent
    environment:
      RADAR_HUB_URL: ${RADAR_HUB_URL:-http://radar-api:8088}
      RADAR_AGENT_TOKEN: ${RADAR_AGENT_TOKEN:-radar-demo-agent-token-probe1}
      RADAR_HTTP_TIMEOUT_SEC: ${RADAR_HTTP_TIMEOUT_SEC:-5}
      RADAR_ICMP_TIMEOUT_SEC: ${RADAR_ICMP_TIMEOUT_SEC:-3}
    cap_add:
      - NET_RAW
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true
