name: radar

services:
  radar-webui:
    image: ${IMAGE_TAG:-radar-webui:latest}
    container_name: radar-webui
    expose:
      - "80"
    environment:
      API_HOST: ${API_HOST:-radar-api}
      API_PORT: ${API_PORT:-8088}
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true
